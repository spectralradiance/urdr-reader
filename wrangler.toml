# One Worker serves the app, the hosted library (dist/library) and the /proxy/* routes.
#   npm run deploy
name = "echtra"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/proxy/*"]
